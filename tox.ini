[tox]
envlist = py39-min, py310, py311, py312
isolated_build = True
requires = tox-uv

[testenv]
dependency_groups = dev
commands =
    ruff check
    ruff format --check
    ty check
    pytest -n auto --no-cov --basetemp={envtmpdir} {posargs}

[testenv:py39-min]
basepython = python3.9
dependency_groups = dev
deps =
    numpy==1.21.0
    scipy==1.9.0
    pandas==1.4.0
    statsmodels==0.13.5
    chartify==5.0.0
    ipywidgets==8.0.0
commands =
    ruff check
    ruff format --check
    # don't run ty check - the type stubs for 3.9 are not good.
    pytest -n auto --no-cov --basetemp={envtmpdir} {posargs}
